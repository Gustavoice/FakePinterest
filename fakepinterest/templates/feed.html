
{% extends "homepage.html" %}

{% block body %}

{% include "navbar.html" %}

<style>
    * {
        box-sizing: border-box;
    }

    body {
        background-color: #f5f5f5;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .feed-container {
        padding: 25px 35px;
    }

    .feed-titulo {
        text-align: center;
        font-size: 28px;
        color: #333;
        margin-bottom: 30px;
        font-weight: bold;
    }

    .feed-galeria {
        columns: 5 220px;
        column-gap: 18px;
        max-width: 1600px;
        margin: auto;
    }

    .foto-card {
        display: block;
        width: 100%;
        margin-bottom: 18px;
        break-inside: avoid;
        border-radius: 18px;
        overflow: hidden;
        background-color: white;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .foto-card img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 18px;
        cursor: pointer;
    }

    .foto-card:hover {
        transform: scale(1.02);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    @media (max-width: 768px) {
        .feed-container {
            padding: 15px;
        }

        .feed-galeria {
            columns: 3 150px;
            column-gap: 12px;
        }
    }

    @media (max-width: 480px) {
        .feed-galeria {
            columns: 2 130px;
            column-gap: 10px;
        }

        .foto-card {
            margin-bottom: 10px;
        }

        .feed-titulo {
            font-size: 23px;
        }
    }
</style>

<div class="feed-container">

    <h1 class="feed-titulo">Feed Principal</h1>

    <div class="feed-galeria">

        {% for foto in fotos %}

            <a class="foto-card"
               href="{{ url_for('perfil', id_usuario=foto.id_usuario) }}">

                <img
                    src="{{ url_for('static', filename='fotos_posts/{}'.format(foto.imagem)) }}"
                    alt="Publicação">

            </a>

        {% endfor %}

    </div>

</div>

{% endblock %}
